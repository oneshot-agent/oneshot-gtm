name: ci

# Lint / typecheck / format / test gate. Runs on every PR into main and on
# pushes to main. Mirrors the local dev commands (Bun + the root package.json
# scripts) so a green CI means the same thing as a green local run.

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

# A newer push to the same branch/PR cancels an in-flight run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13" # match `packageManager` in root package.json

      - name: Install workspace deps
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      # Prompt markdown under packages/prompts is excluded in .oxfmtrc.json —
      # those files are LLM payload, not documents, and oxfmt's markdown rules
      # would rewrite the literal text the model receives.
      - name: Format
        run: bun run fmt:check

      # `--bun` forces the Bun runtime for vitest + its worker pool. Without it,
      # CI runs vitest under Node, where `bun:sqlite` (imported by ledger.ts)
      # doesn't exist and the suite errors with ERR_MODULE_NOT_FOUND.
      - name: Test
        run: bun --bun run test
